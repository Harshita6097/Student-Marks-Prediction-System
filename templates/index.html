<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Student Marks Predictor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .hero {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
        }

        .icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(90deg, #e94560, #0f3460);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        p {
            font-size: 1.1rem;
            color: #a0aec0;
            margin-bottom: 2.5rem;
            line-height: 1.7;
        }

        .btn {
            display: inline-block;
            padding: 0.9rem 2.5rem;
            background: #e94560;
            color: #fff;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(233, 69, 96, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(233, 69, 96, 0.6);
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 3rem;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .stat span {
            display: block;
            font-size: 1.8rem;
            font-weight: 700;
            color: #e94560;
        }

        .stat p {
            font-size: 0.85rem;
            color: #718096;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="icon">🎓</div>
        <h1>Student Marks Predictor</h1>
        <p>Predict a student's math score based on demographic and academic factors using a trained machine learning model.</p>
        <a href="/predictdata" class="btn">Get Prediction →</a>
        <div class="stats">
            <div class="stat">
                <span>7</span>
                <p>Input Features</p>
            </div>
            <div class="stat">
                <span>ML</span>
                <p>Powered</p>
            </div>
            <div class="stat">
                <span>100</span>
                <p>Max Score</p>
            </div>
        </div>
    </div>
</body>
</html>
